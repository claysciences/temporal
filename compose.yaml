name: temporal-ai-orchestrator
services:
  init-storage:
    image: temporalio/temporal:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /data"]
    volumes:
      - temporal-data:/data
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/data
    depends_on:
      init-storage:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  worker:
    build: .
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
  test:
    build: .
    profiles: [test]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["python", "test_workflow.py"]
volumes:
  temporal-data:
